<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TombsPad 🎃</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Creepster&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0d0d1a;
        color: #ff6b00;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      #toolbar {
        background: #1a0a2e;
        padding: 8px 12px;
        border-bottom: 1px solid #3d1a5a;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        min-height: 56px;
      }

      #toolbar-title {
        font-family: 'Creepster', monospace;
        font-size: 1.5rem;
        color: #ff6b00;
        letter-spacing: 0.05em;
        text-shadow: 0 0 8px #ff6b0088;
        user-select: none;
      }

      #canvas-container {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      #canvas-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <span id="toolbar-title">🎃 TombsPad</span>
    </div>
    <div id="canvas-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
